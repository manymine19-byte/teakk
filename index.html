<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티크크 - 찻자리 기록장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Pretendard Font CDN -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #FBF9F5;
            color: #3C3633;
        }
        .font-serif-kr {
            font-family: "Pretendard Variable", Pretendard, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #F1EFE7;
        }
        ::-webkit-scrollbar-thumb {
            background: #D8D2C4;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-[#FBF9F5] text-[#3C3633] min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-[#EFECE6] border-b border-[#E3DFD5] sticky top-0 z-20 px-4 py-3.5 shadow-xs">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🍵</span>
                <div>
                    <h1 class="font-serif-kr font-bold text-base text-[#5C524B] leading-tight">티크크</h1>
                    <p class="text-[10px] text-[#8C8279]">함께 마신 차를 기록해요</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openGatheringModal()" class="bg-[#EAE4D8] text-[#5C524B] text-xs font-medium px-3 py-2 rounded-full shadow-2xs hover:bg-[#DED7C8] transition flex items-center space-x-1">
                    <i class="fa-solid fa-calendar-plus text-[10px]"></i>
                    <span>찻자리 카드 등록</span>
                </button>
                <button onclick="openRecordModal()" class="bg-[#79553D] text-white text-xs font-medium px-3 py-2 rounded-full shadow hover:bg-[#624430] transition flex items-center space-x-1">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>기록하기</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 space-y-5">
        
        <!-- Tab Content: 홈 (Home) -->
        <div id="tab-home" class="space-y-5 tab-content">
            <!-- 1. Top 12 Teacups Tracker Section -->
            <section class="bg-[#F5F2EC] border border-[#E8E2D5] rounded-2xl p-4 shadow-xs">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="font-serif-kr font-semibold text-xs text-[#79553D] uppercase tracking-wider">찻잔 달력</h3>
                    <span id="tracker-count-label" class="text-[10px] text-[#8C8279]">0 / 12</span>
                </div>
                <p class="text-[11px] text-[#736A61] mb-3">찻자리 카드 등록하고 달력 채우기 도전</p>
                
                <!-- 12 Teacups Grid -->
                <div id="teacups-grid" class="grid grid-cols-6 gap-2.5 pt-1">
                    <!-- Dynamically rendered 12 teacups -->
                </div>
            </section>

            <!-- 2. Entire Gathering Records List (찻자리 카드 기록) -->
            <div class="space-y-3 pt-1">
                <div class="flex items-center justify-between px-1">
                    <h3 class="font-serif-kr font-semibold text-xs text-[#79553D] uppercase tracking-wider">찻자리 카드 목록</h3>
                    <span id="gathering-count" class="text-[10px] text-[#8C8279]">총 0개</span>
                </div>

                <div id="gatherings-container" class="space-y-4">
                    <!-- Dynamically Rendered Gathering Cards -->
                </div>
            </div>
        </div>

        <!-- Tab Content: 로그 (Log / Members Tea Archive) -->
        <div id="tab-log" class="space-y-4 tab-content hidden">
            <div class="bg-[#F5F2EC] border border-[#E8E2D5] rounded-2xl p-4 shadow-xs text-center">
                <h2 class="font-serif-kr font-semibold text-sm text-[#4E433C]">찻자리 아카이빙</h2>
                <p class="text-xs text-[#736A61] mt-1">각자 기록한 찻자리 노트를 볼 수 있어요</p>
            </div>

            <div class="space-y-3">
                <div id="member-summary-cards" class="space-y-3">
                    <!-- Dynamically Rendered Member Cards -->
                </div>
            </div>
        </div>

        <!-- Empty State (Global) -->
        <div id="empty-state" class="hidden text-center py-16 px-4">
            <div class="text-4xl mb-3">🫖</div>
            <p class="font-serif-kr text-base text-[#5C524B] mb-1">아직 등록된 찻자리가 없어요</p>
            <p class="text-xs text-[#8C8279] mb-4">상단 '찻자리 카드 등록' 버튼을 눌러 모임을 먼저 생성해보세요!</p>
        </div>

    </main>

    <!-- Bottom Navigation Bar (Tabs) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#FBF9F5] border-t border-[#E3DFD5] py-2.5 px-6 z-10 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="switchTab('home')" id="nav-btn-home" class="flex flex-col items-center space-y-1 text-[#79553D] font-medium transition">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[11px]">홈</span>
            </button>
            <button onclick="switchTab('log')" id="nav-btn-log" class="flex flex-col items-center space-y-1 text-[#A89F91] font-medium transition">
                <i class="fa-solid fa-book-bookmark text-base"></i>
                <span class="text-[11px]">로그</span>
            </button>
        </div>
    </nav>

    <!-- Modal 1: 찻자리 카드 등록 모달 -->
    <div id="gathering-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center sm:p-4 hidden transition-opacity">
        <div class="bg-[#FBF9F5] w-full sm:max-w-lg max-h-[90vh] rounded-t-3xl sm:rounded-2xl shadow-xl flex flex-col overflow-hidden">
            <div class="px-5 py-4 border-b border-[#E8E2D5] flex items-center justify-between bg-[#F5F2EC]">
                <h3 class="font-serif-kr font-semibold text-sm text-[#4E433C]">찻자리 카드 등록하기</h3>
                <button onclick="closeGatheringModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-[#736A61] hover:bg-[#EAE4D8] transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto flex-1">
                <form id="gathering-form" onsubmit="saveGatheringCard(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-medium text-[#685D54] mb-1">모임 날짜 *</label>
                            <input type="date" id="g-date" required class="w-full text-xs px-3 py-2 bg-white border border-[#E3DFD5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#79553D]">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-[#685D54] mb-1">날씨 *</label>
                            <select id="g-weather" class="w-full text-xs px-3 py-2 bg-white border border-[#E3DFD5] rounded-lg focus:outline-none">
                                <option value="☀️ 맑음">☀️ 맑음</option>
                                <option value="☁️ 흐림">☁️ 흐림</option>
                                <option value="🌧️ 비">🌧️ 비</option>
                                <option value="❄️ 눈">❄️ 눈</option>
                                <option value="🍃 선선한 바람">🍃 선선한 바람</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-medium text-[#685D54] mb-1">티하우스 이름 *</label>
                            <input type="text" id="g-teahouse" placeholder="예: 절영 티룸" required class="w-full text-xs px-3 py-2 bg-white border border-[#E3DFD5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#79553D]">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-[#685D54] mb-1">티하우스 지역 *</label>
                            <input type="text" id="g-region" placeholder="예: 서울 종로구" required class="w-full text-xs px-3 py-2 bg-white border border-[#E3DFD5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#79553D]">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-medium text-[#685D54] mb-1">이번 달 주제</label>
                            <input type="text" id="g-theme" placeholder="예: 백차 탐구" class="w-full text-xs px-3 py-2 bg-white border border-[#E3DFD5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#79553D]">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-[#685D54] mb-1">담당자</label>
                            <select id="g-manager" class="w-full text-xs px-3 py-2 bg-white border border-[#E3DFD5] rounded-lg focus:outline-none">
                                <option value="경민">경민</option>
                                <option value="다인">다인</option>
                                <option value="다은">다은</option>
                                <option value="보현">보현</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-[#685D54] mb-1">티하우스 설명</label>
                        <input type="text" id="g-description" placeholder="예: 센차와 화과자가 유명한 곳" class="w-full text-xs px-3 py-2 bg-white border border-[#E3DFD5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#79553D]">
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-[#79553D] text-white py-3 rounded-xl font-medium text-xs shadow hover:bg-[#624430] transition">
                            찻자리 카드 생성하기
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal 2: 개인 기록하기 모달 -->
    <div id="record-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center sm:p-4 hidden transition-opacity">
        <div class="bg-[#FBF9F5] w-full sm:max-w-lg max-h-[90vh] rounded-t-3xl sm:rounded-2xl shadow-xl flex flex-col overflow-hidden">
            <div class="px-5 py-4 border-b border-[#E8E2D5] flex items-center justify-between bg-[#F5F2EC]">
                <h3 class="font-serif-kr font-semibold text-sm text-[#4E433C]">찻자리 기록 남기기</h3>
                <button onclick="closeRecordModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-[#736A61] hover:bg-[#EAE4D8] transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto flex-1">
                <form id="record-form" onsubmit="saveMemberRecords(event)" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-medium text-[#685D54] mb-1">찻자리 선택 (티하우스) *</label>
                        <select id="rec-gathering-id" required class="w-full text-xs px-3 py-2 bg-white border border-[#E3DFD5] rounded-lg focus:outline-none">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-[#685D54] mb-1">기록자 (멤버 선택) *</label>
                        <select id="rec-member" required class="w-full text-xs px-3 py-2 bg-white border border-[#E3DFD5] rounded-lg focus:outline-none">
                            <option value="경민">경민</option>
                            <option value="다인">다인</option>
                            <option value="다은">다은</option>
                            <option value="보현">보현</option>
                        </select>
                    </div>

                    <div class="space-y-3 pt-2 border-t border-[#E8E2D5]">
                        <div class="flex items-center justify-between">
                            <h4 class="text-xs font-bold text-[#79553D] uppercase">마신 차 리스트</h4>
                            <button type="button" onclick="addModalTeaItem()" class="text-xs text-[#79553D] font-medium bg-[#F5F2EC] px-2.5 py-1 rounded-md hover:bg-[#EAE4D8] transition">
                                <i class="fa-solid fa-plus text-[9px]"></i> 차 추가하기
                            </button>
                        </div>
                        <div id="modal-tea-items-container" class="space-y-3">
                            <!-- Dynamic items -->
                        </div>
                    </div>

                    <div class="pt-3">
                        <button type="submit" class="w-full bg-[#79553D] text-white py-3 rounded-xl font-medium text-xs shadow hover:bg-[#624430] transition">
                            내 기록 저장하기
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Message Box -->
    <div id="toast" class="fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-[#3C3633] text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        알림 메시지입니다.
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyHll6QgzCJTbkRMP1QSt3yL7MVA90RVfUGUXNdFgeMyThd8mwk7EW_ofn4VHM3Rl1C/exec";
        const MEMBERS = ["경민", "다인", "다은", "보현"];
        const TEA_TYPES = ["녹차", "홍차", "우롱차", "흑차", "백차", "황차", "허브티/블렌디드", "말차", "티음료"];
        const MEMBER_PASSWORD = "duck2026";
        const LIQUOR_COLORS = [
            { name: "투명/맑음", hex: "#FAF8F5", border: "#E3DFD5" },
            { name: "연한 황록색", hex: "#E2ECC8", border: "#C5D89E" },
            { name: "황금빛 노랑", hex: "#FCE883", border: "#E4CC53" },
            { name: "따뜻한 호박색", hex: "#F3C68F", border: "#D8A462" },
            { name: "붉은 홍차색", hex: "#D97757", border: "#B55333" },
            { name: "짙은 갈색", hex: "#8D5B4C", border: "#633C30" }
        ];

        let gatherings = [];
        let memberExpandedState = {};
        let currentTab = 'home';

        window.onload = async function() {
            await loadFromGoogleSheet();
            renderTracker();
            renderGatherings();
            renderMemberSummaries();
            document.getElementById('g-date').value = new Date().toISOString().split('T')[0];
        };

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        function switchTab(tab) {
            currentTab = tab;
            const homeTab = document.getElementById('tab-home');
            const logTab = document.getElementById('tab-log');
            const btnHome = document.getElementById('nav-btn-home');
            const btnLog = document.getElementById('nav-btn-log');

            if (tab === 'home') {
                homeTab.classList.remove('hidden');
                logTab.classList.add('hidden');
                btnHome.className = "flex flex-col items-center space-y-1 text-[#79553D] font-medium transition";
                btnLog.className = "flex flex-col items-center space-y-1 text-[#A89F91] font-medium transition";
            } else {
                homeTab.classList.add('hidden');
                logTab.classList.remove('hidden');
                btnLog.className = "flex flex-col items-center space-y-1 text-[#79553D] font-medium transition";
                btnHome.className = "flex flex-col items-center space-y-1 text-[#A89F91] font-medium transition";
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function loadFromGoogleSheet() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (!data.gatherings || !Array.isArray(data.gatherings) || data.gatherings.length === 0) {
                    gatherings = [];
                } else {
                    gatherings = data.gatherings;
                }
            } catch(e) {
                console.error("데이터 로드 실패", e);
                gatherings = [];
                showToast("데이터를 불러오는데 실패했습니다.");
            }
        }

        async function sendToSheet(type, payload) {
            try {
                const res = await fetch(API_URL);
                const serverData = await res.json();
                let currentGatherings = serverData.gatherings || [];

                if (type === 'gathering') {
                    currentGatherings.unshift(payload);
                } else if (type === 'gathering_update' || type === 'record') {
                    currentGatherings = payload;
                }

                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ type: 'gathering', payload: currentGatherings })
                });
            } catch (e) {
                console.error("서버 전송 실패", e);
                showToast("서버 전송 중 오류가 발생했습니다.");
            }
        }

        function renderTracker() {
            const grid = document.getElementById('teacups-grid');
            const countLabel = document.getElementById('tracker-count-label');
            grid.innerHTML = '';
            
            const totalCount = gatherings.length;
            countLabel.textContent = `${totalCount} / 12 달성`;

            for (let i = 0; i < 12; i++) {
                const isFilled = i < totalCount;
                const cupEl = document.createElement('div');
                cupEl.className = `aspect-square rounded-xl border flex flex-col items-center justify-center transition-all ${
                    isFilled 
                        ? 'bg-[#F3C68F]/30 border-[#D8A462] shadow-xs transform scale-102' 
                        : 'bg-white/50 border-[#E8E2D5] opacity-50'
                }`;
                
                cupEl.innerHTML = `
                    <span class="text-base">${isFilled ? '🍵' : '☕'}</span>
                    <span class="text-[9px] font-semibold mt-0.5 ${isFilled ? 'text-[#79553D]' : 'text-[#A89F91]'}">#${i + 1}</span>
                `;
                grid.appendChild(cupEl);
            }
        }

        function openGatheringModal() {
            const password = prompt("멤버 전용 비밀번호를 입력해주세요:");
            if (password !== MEMBER_PASSWORD) {
                if (password !== null) {
                    showToast("비밀번호가 일치하지 않습니다. (멤버 전용)");
                }
                return;
            }

            document.getElementById('gathering-form').reset();
            document.getElementById('g-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('gathering-modal').classList.remove('hidden');
        }

        function closeGatheringModal() {
            document.getElementById('gathering-modal').classList.add('hidden');
        }

        async function saveGatheringCard(e) {
            e.preventDefault();
            const date = document.getElementById('g-date').value;
            const weather = document.getElementById('g-weather').value;
            const teahouse = document.getElementById('g-teahouse').value;
            const region = document.getElementById('g-region').value;
            const theme = document.getElementById('g-theme').value;
            const manager = document.getElementById('g-manager').value;
            const description = document.getElementById('g-description').value;

            const newGathering = {
                id: 'g_' + Date.now(),
                date,
                weather,
                teahouse,
                region,
                theme,
                manager,
                description,
                memberRecords: {}
            };

            gatherings.unshift(newGathering);
            await sendToSheet('gathering', newGathering);
            renderTracker();
            renderGatherings();
            renderMemberSummaries();
            closeGatheringModal();
            showToast("찻자리 카드가 생성되었습니다 🍵");
        }

        function openRecordModal() {
            if (gatherings.length === 0) {
                showToast("먼저 등록된 찻자리 카드가 없습니다!");
                return;
            }

            const password = prompt("멤버 전용 비밀번호를 입력해주세요:");
            if (password !== MEMBER_PASSWORD) {
                if (password !== null) {
                    showToast("비밀번호가 일치하지 않습니다. (멤버 전용)");
                }
                return;
            }

            const selectEl = document.getElementById('rec-gathering-id');
            selectEl.innerHTML = '';
            gatherings.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = `[${g.date}] ${g.teahouse} (${g.region})`;
                selectEl.appendChild(opt);
            });

            document.getElementById('modal-tea-items-container').innerHTML = '';
            addModalTeaItem();
            document.getElementById('record-modal').classList.remove('hidden');
        }

        function closeRecordModal() {
            document.getElementById('record-modal').classList.add('hidden');
        }

        function addModalTeaItem(data = {}) {
            const container = document.getElementById('modal-tea-items-container');
            const idx = container.children.length;
            
            const itemDiv = document.createElement('div');
            itemDiv.className = "bg-[#FBF9F5] p-3 rounded-lg border border-[#E3DFD5] space-y-2.5 relative";
            
            let typeOptions = TEA_TYPES.map(t => `<option value="${t}" ${data.type === t ? 'selected' : ''}>${t}</option>`).join('');
            
            let colorButtonsHTML = '';
            LIQUOR_COLORS.forEach(c => {
                const isSelected = (data.colorHex === c.hex) || (!data.colorHex && c.hex === "#F3C68F");
                colorButtonsHTML += `
                    <button type="button" 
                        class="w-6 h-6 rounded-full border-2 transition transform hover:scale-110 color-btn ${isSelected ? 'ring-2 ring-[#79553D] scale-105' : ''}" 
                        style="background-color: ${c.hex}; border-color: ${c.border};" 
                        title="${c.name}"
                        onclick="selectColor(this, '${c.hex}', '${c.name}')">
                    </button>
                `;
            });

            itemDiv.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-semibold text-[#8C8279] uppercase">차 항목 #${idx + 1}</span>
                    ${idx > 0 ? `<button type="button" onclick="this.closest('.bg-\\[\\#FBF9F5\\]').remove()" class="text-xs text-red-400 hover:text-red-600"><i class="fa-solid fa-trash-can"></i> 삭제</button>` : ''}
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-[#685D54] mb-0.5">차 이름 *</label>
                        <input type="text" name="tea-name" value="${data.name || ''}" placeholder="예: 동정우롱" required class="w-full text-xs px-2.5 py-1.5 bg-white border border-[#E3DFD5] rounded-md focus:outline-none focus:ring-1 focus:ring-[#79553D]">
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#685D54] mb-0.5">차 종류</label>
                        <select name="tea-type" class="w-full text-xs px-2 py-1.5 bg-white border border-[#E3DFD5] rounded-md focus:outline-none">
                            ${typeOptions}
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] text-[#685D54] mb-1">수색 (우린 색상 선택)</label>
                    <div class="flex items-center space-x-2 bg-white p-2 rounded-md border border-[#E3DFD5]">
                        <div class="flex items-center space-x-1.5 color-palette-container">
                            ${colorButtonsHTML}
                        </div>
                        <input type="hidden" name="tea-color-hex" value="${data.colorHex || '#F3C68F'}">
                        <input type="hidden" name="tea-color-name" value="${data.colorName || '따뜻한 호박색'}">
                        <span class="text-[10px] text-[#736A61] font-medium selected-color-label">${data.colorName || '따뜻한 호박색'}</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-[#685D54] mb-0.5">향과 맛 *</label>
                        <input type="text" name="tea-flavor" value="${data.flavor || ''}" placeholder="예: 곡물향, 꽃향" required class="w-full text-xs px-2.5 py-1.5 bg-white border border-[#E3DFD5] rounded-md focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] text-[#685D54] mb-0.5">함께 먹은 다과</label>
                        <input type="text" name="tea-snack" value="${data.snack || ''}" placeholder="예: 말차 화과자" class="w-full text-xs px-2.5 py-1.5 bg-white border border-[#E3DFD5] rounded-md focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] text-[#685D54] mb-0.5">메모 (시음 소감)</label>
                    <input type="text" name="tea-memo" value="${data.memo || ''}" placeholder="간단한 메모" class="w-full text-xs px-2.5 py-1.5 bg-white border border-[#E3DFD5] rounded-md focus:outline-none">
                </div>
            `;
            container.appendChild(itemDiv);
        }

        function selectColor(btn, hex, name) {
            const container = btn.closest('div').parentElement;
            const parentPalette = btn.parentElement;
            parentPalette.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-2', 'ring-[#79553D]', 'scale-105'));
            btn.classList.add('ring-2', 'ring-[#79553D]', 'scale-105');
            
            container.querySelector('[name="tea-color-hex"]').value = hex;
            container.querySelector('[name="tea-color-name"]').value = name;
            container.querySelector('.selected-color-label').textContent = name;
        }

        async function saveMemberRecords(e) {
            e.preventDefault();
            const gatheringId = document.getElementById('rec-gathering-id').value;
            const member = document.getElementById('rec-member').value;

            const teaItems = document.querySelectorAll('#modal-tea-items-container > div');
            const teas = [];
            teaItems.forEach(item => {
                const name = item.querySelector('[name="tea-name"]').value;
                const type = item.querySelector('[name="tea-type"]').value;
                const colorHex = item.querySelector('[name="tea-color-hex"]').value;
                const colorName = item.querySelector('[name="tea-color-name"]').value;
                const flavor = item.querySelector('[name="tea-flavor"]').value;
                const snack = item.querySelector('[name="tea-snack"]').value;
                const memo = item.querySelector('[name="tea-memo"]').value;

                if (name.trim()) {
                    teas.push({ name, type, colorHex, colorName, flavor, snack, memo });
                }
            });

            if (teas.length === 0) {
                showToast("최소 1개 이상의 차를 입력해주세요.");
                return;
            }

            // 서버에서 가장 최신 데이터를 불러와서 동기화 후 업데이트 (기존 기록 날라감 방지)
            try {
                const res = await fetch(API_URL);
                const serverData = await res.json();
                let currentGatherings = serverData.gatherings || gatherings;

                const gathering = currentGatherings.find(g => g.id === gatheringId);
                if (gathering) {
                    if (!gathering.memberRecords) gathering.memberRecords = {};
                    // 해당 멤버의 기록을 새로 추가/덮어쓰되 다른 멤버 기록은 유지
                    gathering.memberRecords[member] = teas;

                    gatherings = currentGatherings;
                    await sendToSheet('gathering_update', gatherings);
                    
                    renderTracker();
                    renderGatherings();
                    renderMemberSummaries();
                    closeRecordModal();
                    showToast(`${member}님의 기록이 저장되었습니다 🍵`);
                }
            } catch (err) {
                console.error("기록 저장 중 오류 발생", err);
                showToast("저장 중 오류가 발생했습니다.");
            }
        }

        async function deleteGathering(id) {
            if (confirm("이 찻자리 카드와 모든 기록을 삭제하시겠습니까?")) {
                gatherings = gatherings.filter(g => g.id !== id);
                await sendToSheet('gathering_update', gatherings);
                renderTracker();
                renderGatherings();
                renderMemberSummaries();
                showToast("삭제되었습니다.");
            }
        }

        function toggleMemberExpand(member) {
            memberExpandedState[member] = !memberExpandedState[member];
            renderMemberSummaries();
        }

        function renderMemberSummaries() {
            const container = document.getElementById('member-summary-cards');
            container.innerHTML = '';

            MEMBERS.forEach(member => {
                let allMemberTeas = [];
                gatherings.forEach(g => {
                    if (g.memberRecords && g.memberRecords[member]) {
                        g.memberRecords[member].forEach(t => {
                            allMemberTeas.push({ ...t, teahouse: g.teahouse, date: g.date });
                        });
                    }
                });

                const isExpanded = !!memberExpandedState[member];
                const displayTeas = isExpanded ? allMemberTeas : allMemberTeas.slice(0, 3);
                const hasMore = allMemberTeas.length > 3;

                let teaItemsHTML = '';
                if (allMemberTeas.length === 0) {
                    teaItemsHTML = `<p class="text-[11px] text-[#A89F91] italic py-1">아직 기록된 차가 없습니다.</p>`;
                } else {
                    displayTeas.forEach(t => {
                        teaItemsHTML += `
                            <div class="bg-[#FBF9F5] p-2.5 rounded-lg border border-[#E3DFD5] space-y-1 text-xs">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-1.5">
                                        <span class="w-2.5 h-2.5 rounded-full shadow-2xs" style="background-color: ${t.colorHex || '#F3C68F'};"></span>
                                        <span class="font-semibold text-[#4E433C]">${t.name}</span>
                                        <span class="text-[10px] text-[#8C8279] bg-white px-1.5 py-0.2 rounded border border-[#EFECE6]">${t.type}</span>
                                    </div>
                                    <span class="text-[10px] text-[#8C8279]">${t.teahouse}</span>
                                </div>
                                <div class="text-[11px] text-[#79553D] font-medium bg-white/70 px-2 py-1 rounded border border-[#F1EFE7]">
                                    🌿 향과 맛: ${t.flavor}
                                </div>
                                ${t.snack ? `<div class="text-[10px] text-[#736A61]">🍡 다과: ${t.snack}</div>` : ''}
                                ${t.memo ? `<div class="text-[10px] text-[#685D54] italic">💭 메모: ${t.memo}</div>` : ''}
                            </div>
                        `;
                    });
                }

                const card = document.createElement('div');
                card.className = "bg-white border border-[#E8E2D5] rounded-xl p-3.5 shadow-xs space-y-2.5";
                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-[#F1EFE7] pb-2">
                        <div class="flex items-center space-x-2">
                            <span class="w-6 h-6 rounded-full bg-[#79553D] text-white text-xs font-bold flex items-center justify-center">${member.slice(0, 1)}</span>
                            <h4 class="font-serif-kr font-bold text-xs text-[#4E433C]">${member}의 마신 차 리스트</h4>
                        </div>
                        <span class="text-[10px] bg-[#F5F2EC] text-[#79553D] px-2 py-0.5 rounded-full font-semibold">총 ${allMemberTeas.length}잔</span>
                    </div>
                    <div class="space-y-2">
                        ${teaItemsHTML}
                    </div>
                    ${hasMore ? `
                        <button onclick="toggleMemberExpand('${member}')" class="w-full text-center text-[11px] text-[#79553D] font-medium py-1.5 bg-[#F5F2EC] hover:bg-[#EAE4D8] rounded-md transition mt-1">
                            ${isExpanded ? '접기 ∧' : `+ 더보기 (전체 ${allMemberTeas.length}개 보기) ∨`}
                        </button>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        function renderGatherings() {
            const container = document.getElementById('gatherings-container');
            const emptyState = document.getElementById('empty-state');
            const countLabel = document.getElementById('gathering-count');

            countLabel.textContent = `총 ${gatherings.length}개`;

            if (gatherings.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = '';

            gatherings.forEach(g => {
                const card = document.createElement('div');
                card.className = "bg-white border border-[#E8E2D5] rounded-2xl shadow-xs overflow-hidden transition hover:shadow-md";

                const formattedDate = g.date.replace(/-/g, '. ');

                const teaMap = {}; 
                if (g.memberRecords) {
                    Object.keys(g.memberRecords).forEach(member => {
                        const teas = g.memberRecords[member];
                        if (teas) {
                            teas.forEach(t => {
                                if (!teaMap[t.name]) {
                                    teaMap[t.name] = {
                                        type: t.type,
                                        entries: [],
                                        colors: new Set()
                                    };
                                }
                                teaMap[t.name].entries.push({ member, flavor: t.flavor, colorHex: t.colorHex || '#F3C68F' });
                                if (t.colorHex) {
                                    teaMap[t.name].colors.add(t.colorHex);
                                }
                            });
                        }
                    });
                }

                let teaGroupsHTML = '';
                const teaKeys = Object.keys(teaMap);
                
                if (teaKeys.length === 0) {
                    teaGroupsHTML = `<p class="text-[11px] text-[#A89F91] italic py-1 text-center">아직 등록된 개인 기록이 없어요. 상단 '기록하기'를 눌러보세요!</p>`;
                } else {
                    teaKeys.forEach(teaName => {
                        const teaInfo = teaMap[teaName];
                        let colorCirclesHTML = '';
                        teaInfo.colors.forEach(hex => {
                            colorCirclesHTML += `<span class="w-3 h-3 rounded-full border border-black/10 inline-block shadow-2xs" style="background-color: ${hex};" title="수색"></span>`;
                        });

                        let memberLinesHTML = '';
                        teaInfo.entries.forEach(entry => {
                            memberLinesHTML += `
                                <div class="text-xs text-[#5C524B] flex items-start space-x-1.5 py-0.5">
                                    <span class="font-bold text-[#79553D] shrink-0">[${entry.member}]</span>
                                    <span class="text-[#685D54]">향과 맛: ${entry.flavor}</span>
                                </div>
                            `;
                        });

                        teaGroupsHTML += `
                            <div class="bg-[#FBF9F5] p-3 rounded-xl border border-[#E3DFD5] space-y-2">
                                <div class="flex items-center justify-between border-b border-[#F1EFE7] pb-1.5">
                                    <div class="flex items-center space-x-2">
                                        <div class="flex items-center space-x-1">
                                            ${colorCirclesHTML}
                                        </div>
                                        <span class="font-serif-kr font-bold text-xs text-[#3C3633]">${teaName}</span>
                                        <span class="text-[10px] text-[#8C8279] bg-white px-1.5 py-0.2 rounded border border-[#EFECE6]">${teaInfo.type}</span>
                                    </div>
                                </div>
                                <div class="space-y-1 pl-1">
                                    ${memberLinesHTML}
                                </div>
                            </div>
                        `;
                    });
                }

                card.innerHTML = `
                    <div class="bg-[#F5F2EC] px-4 py-3 border-b border-[#E8E2D5]">
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[11px] font-semibold text-[#79553D] bg-white px-2 py-0.5 rounded border border-[#E3DFD5]">${formattedDate}</span>
                                <span class="text-[11px] text-[#736A61]">${g.weather || ''}</span>
                                <span class="text-[11px] text-[#736A61] bg-white/60 px-1.5 py-0.5 rounded">📍 ${g.region}</span>
                            </div>
                            <button onclick="deleteGathering('${g.id}')" class="text-xs text-[#A89F91] hover:text-red-500 p-1 transition" title="기록 삭제">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <div class="flex items-center justify-between mt-1">
                            <h3 class="font-serif-kr font-bold text-base text-[#3C3633] flex items-center space-x-1.5">
                                <i class="fa-solid fa-mug-hot text-[#79553D] text-sm"></i>
                                <span>${g.teahouse}</span>
                            </h3>
                            ${g.theme ? `<span class="text-[11px] font-medium text-[#5C524B] bg-[#EFECE6] px-2 py-0.5 rounded-full"># ${g.theme}</span>` : ''}
                        </div>
                        ${g.description ? `
                            <p class="text-xs text-[#685D54] mt-2 bg-white/80 p-2 rounded-lg border border-[#E8E2D5] italic">
                                💡 ${g.description}
                            </p>
                        ` : ''}
                        <div class="text-[10px] text-[#8C8279] mt-2">
                            담당자: ${g.manager || '경민'}
                        </div>
                    </div>
                    <div class="p-4 space-y-3">
                        <div class="space-y-2.5">
                            ${teaGroupsHTML}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
