<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티크크 - 찻자리 기록장</title>
    <!-- Pretendard Font CDN -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
            background-color: #FBF9F5; /* 웜 아이보리 배경 */
            color: #3C3633; /* 딥 차콜 텍스트 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 440px; /* 모바일 뷰포트 최우선 고려 */
            margin: 0 auto;
        }
        header {
            background-color: #F5F2EC; /* 라이트 베이지 */
            border-bottom: 1px solid #E3DFD5;
            position: sticky;
            top: 0;
            z-index: 20;
            padding: 12px 16px;
        }
        .container {
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 100px;
            flex: 1;
        }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .space-y-4 > * + * { margin-top: 16px; }
        
        .btn {
            border: none;
            cursor: pointer;
            border-radius: 9999px; /* 완전한 알약형 */
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
            min-height: 36px;
        }
        .btn-primary { 
            background-color: #79553D; /* 딥 우드 브라운 */
            color: white; 
        }
        .btn-primary:hover { 
            background-color: #624430; /* 다크 우드 Hover */
        }
        .btn-secondary { 
            background-color: #EAE4D8; 
            color: #5C524B; 
        }
        .btn-secondary:hover { 
            background-color: #DED7C8; 
        }

        .card {
            background: #FFFFFF; /* 카드 기본 배경 */
            border: 1px solid #E8E2D5; /* 소프트 보더 */
            border-radius: 20px; /* 16px~24px 부드러운 모서리 */
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02); /* 미세한 그림자 */
            margin-bottom: 16px;
        }
        .card-sub {
            background: #F5F2EC; /* 라이트 베이지 서브 카드 */
            border: 1px solid #E8E2D5;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative; /* 프레임 상단 타이틀 배치를 위해 추가 */
        }
        
        .grid-6 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }
        .teacup-box {
            aspect-ratio: 1;
            border-radius: 12px;
            border: 1px solid #E8E2D5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.5);
        }
        .teacup-box.filled {
            background: rgba(243, 198, 143, 0.3);
            border-color: #79553D;
        }

        nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: #FBF9F5;
            border-top: 1px solid #E3DFD5;
            padding: 10px 24px;
            z-index: 10;
        }
        nav button {
            background: none; border: none; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 10px; color: #A89F91; font-weight: 500;
            min-height: 44px; /* 모바일 터치 영역 확보 */
            justify-content: center;
        }
        nav button.active { color: #79553D; }

        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 50; display: flex; align-items: flex-end; justify-content: center;
        }
        .modal-content {
            background: #FBF9F5; width: 100%; max-width: 440px;
            max-height: 90vh; border-radius: 24px 24px 0 0; overflow-y: auto;
            display: flex; flex-direction: column;
        }

        .form-input, .form-select {
            width: 100%; font-size: 12px; padding: 8px 12px;
            background: white; border: 1px solid #E3DFD5; border-radius: 10px;
            outline: none; margin-top: 4px; min-height: 40px;
        }
        .form-label { font-size: 11px; font-weight: 600; color: #5C524B; display: block; }
        .hidden { display: none !important; }
        
        #toast {
            position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
            background: #3C3633; color: white; font-size: 11px; padding: 10px 16px;
            border-radius: 9999px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 60;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="flex items-center" style="gap: 8px;">
                <span style="font-size: 20px;">🍵</span>
                <div>
                    <h1 style="font-size: 14px; font-weight: bold; color: #3C3633; line-height: 1.2;">티크크</h1>
                    <p style="font-size: 10px; color: #8C8279;">함께 마신 차를 기록해요</p>
                </div>
            </div>
            <div class="flex items-center" style="gap: 6px;">
                <button onclick="openGatheringModal()" class="btn btn-secondary">
                    <i class="fa-solid fa-calendar-plus" style="font-size: 10px;"></i>
                    <span>카드 등록</span>
                </button>
                <button onclick="openRecordModal()" class="btn btn-primary">
                    <i class="fa-solid fa-plus" style="font-size: 10px;"></i>
                    <span>기록하기</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container space-y-4">
        <!-- Home Tab -->
        <div id="tab-home" class="space-y-4">
            <section class="card-sub" style="padding-top: 24px;">
                <div style="position: absolute; top: -10px; left: 20px; background: #79553D; color: white; padding: 2px 10px; border-radius: 99px; font-size: 10px; font-weight: 700;">찻자리 카드 목록</div>
                <div class="flex items-center justify-between" style="margin-bottom: 8px;">
                    <h3 style="font-size: 12px; font-weight: 700; color: #79553D; text-transform: uppercase; opacity: 0;">찻자리 카드 목록</h3>
                    <span id="tracker-count-label" style="font-size: 10px; color: #8C8279;">0 / 12</span>
                </div>
                <p style="font-size: 11px; color: #736A61; margin-bottom: 12px;">찻자리 카드 등록하고 달력 채우기 도전</p>
                <div id="teacups-grid" class="grid-6"></div>
            </section>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="flex items-center justify-between" style="padding: 0 4px;">
                    <h3 style="font-size: 12px; font-weight: 700; color: #79553D; text-transform: uppercase;">찻자리 카드 목록</h3>
                    <span id="gathering-count" style="font-size: 10px; color: #8C8279;">총 0개</span>
                </div>
                <div id="gatherings-container" style="display: flex; flex-direction: column; gap: 16px;"></div>
            </div>
        </div>

        <!-- Log Tab -->
        <div id="tab-log" class="space-y-4 hidden">
            <div class="card-sub" style="text-align: center;">
                <h2 style="font-size: 13px; font-weight: 700; color: #3C3633;">📝 찻자리 아카이빙</h2>
                <p style="font-size: 11px; color: #736A61; margin-top: 4px;">각자 기록한 찻자리 노트를 볼 수 있어요</p>
            </div>
            <div id="member-summary-cards" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden" style="text-align: center; padding: 64px 16px;">
            <div style="font-size: 36px; margin-bottom: 12px;">🫖</div>
            <p style="font-size: 13px; color: #3C3633; font-weight: bold; margin-bottom: 4px;">아직 등록된 찻자리가 없어요</p>
            <p style="font-size: 11px; color: #8C8279;">상단 '카드 등록' 버튼을 눌러 모임을 먼저 생성해보세요!</p>
        </div>
    </main>

    <!-- Navigation Bar -->
    <nav>
        <div style="display: flex; justify-content: space-around; align-items: center;">
            <button onclick="switchTab('home')" id="nav-btn-home" class="active">
                <i class="fa-solid fa-house" style="font-size: 16px;"></i>
                <span>홈</span>
            </button>
            <button onclick="switchTab('log')" id="nav-btn-log">
                <i class="fa-solid fa-book-bookmark" style="font-size: 16px;"></i>
                <span>로그</span>
            </button>
        </div>
    </nav>

    <!-- Modal 1: Gathering (카드 등록 / 수정) -->
    <div id="gathering-modal" class="modal-bg hidden">
        <div class="modal-content">
            <div style="padding: 16px 20px; border-bottom: 1px solid #E8E2D5; display: flex; align-items: center; justify-content: space-between; background: #F5F2EC;">
                <h3 id="gathering-modal-title" style="font-size: 13px; font-weight: bold; color: #3C3633;">찻자리 카드 등록하기</h3>
                <button onclick="closeGatheringModal()" style="background:none; border:none; cursor:pointer; font-size:16px; color:#736A61; padding: 4px;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="padding: 20px; overflow-y: auto;">
                <form id="gathering-form" onsubmit="saveGatheringCard(event)" style="display: flex; flex-direction: column; gap: 12px;">
                    <input type="hidden" id="g-id">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label class="form-label">모임 날짜 *</label>
                            <input type="date" id="g-date" required class="form-input">
                        </div>
                        <div>
                            <label class="form-label">날씨 *</label>
                            <select id="g-weather" class="form-select">
                                <option value="☀️ 맑음">☀️ 맑음</option>
                                <option value="☁️ 흐림">☁️ 흐림</option>
                                <option value="🌧️ 비">🌧️ 비</option>
                                <option value="❄️ 눈">❄️ 눈</option>
                                <option value="🍃 선선한 바람">🍃 선선한 바람</option>
                            </select>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label class="form-label">티하우스 이름 *</label>
                            <input type="text" id="g-teahouse" placeholder="예: 절영 티룸" required class="form-input">
                        </div>
                        <div>
                            <label class="form-label">티하우스 지역 *</label>
                            <input type="text" id="g-region" placeholder="예: 서울 종로구" required class="form-input">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label class="form-label">이번 달 주제</label>
                            <input type="text" id="g-theme" placeholder="예: 백차 탐구" class="form-input">
                        </div>
                        <div>
                            <label class="form-label">담당자</label>
                            <select id="g-manager" class="form-select">
                                <option value="경민">경민</option>
                                <option value="다인">다인</option>
                                <option value="다은">다은</option>
                                <option value="보현">보현</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="form-label">티하우스 설명</label>
                        <input type="text" id="g-description" placeholder="예: 센차와 화과자가 유명한 곳" class="form-input">
                    </div>
                    <div style="margin-top: 8px;">
                        <button type="submit" id="gathering-submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; border-radius: 12px;">찻자리 카드 생성하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal 2: Record (기록 등록 / 수정) -->
    <div id="record-modal" class="modal-bg hidden">
        <div class="modal-content">
            <div style="padding: 16px 20px; border-bottom: 1px solid #E8E2D5; display: flex; align-items: center; justify-content: space-between; background: #F5F2EC;">
                <h3 id="record-modal-title" style="font-size: 13px; font-weight: bold; color: #3C3633;">찻자리 기록 남기기</h3>
                <button onclick="closeRecordModal()" style="background:none; border:none; cursor:pointer; font-size:16px; color:#736A61; padding: 4px;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="padding: 20px; overflow-y: auto;">
                <form id="record-form" onsubmit="saveMemberRecords(event)" style="display: flex; flex-direction: column; gap: 12px;">
                    <div>
                        <label class="form-label">찻자리 선택 *</label>
                        <select id="rec-gathering-id" required class="form-select"></select>
                    </div>
                    <div>
                        <label class="form-label">기록자 (멤버) *</label>
                        <select id="rec-member" required class="form-select">
                            <option value="경민">경민</option>
                            <option value="다인">다인</option>
                            <option value="다은">다은</option>
                            <option value="보현">보현</option>
                        </select>
                    </div>
                    <div style="border-top: 1px solid #E8E2D5; padding-top: 12px; display: flex; flex-direction: column; gap: 10px;">
                        <div class="flex items-center justify-between">
                            <h4 style="font-size: 12px; font-weight: bold; color: #79553D;">마신 차 리스트</h4>
                            <button type="button" onclick="addModalTeaItem()" class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;">
                                <i class="fa-solid fa-plus"></i> 차 추가
                            </button>
                        </div>
                        <div id="modal-tea-items-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
                    </div>
                    <div style="margin-top: 8px;">
                        <button type="submit" id="record-submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; border-radius: 12px;">내 기록 저장하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Message -->
    <div id="toast">알림 메시지입니다.</div>

    <!-- JS Logic -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyHll6QgzCJTbkRMP1QSt3yL7MVA90RVfUGUXNdFgeMyThd8mwk7EW_ofn4VHM3Rl1C/exec";
        const MEMBERS = ["경민", "다인", "다은", "보현"];
        const TEA_TYPES = ["녹차", "홍차", "우롱차", "흑차", "백차", "황차", "허브티/블렌디드", "말차", "티음료"];
        const MEMBER_PASSWORD = "duck2026";
        const LIQUOR_COLORS = [
            { name: "투명/맑음", hex: "#FAF8F5", border: "#E3DFD5" },
            { name: "연한 황록색", hex: "#E2ECC8", border: "#C5D89E" },
            { name: "황금빛 노랑", hex: "#FCE883", border: "#E4CC53" },
            { name: "따뜻한 호박색", hex: "#F3C68F", border: "#D8A462" },
            { name: "붉은 홍차색", hex: "#D97757", border: "#B55333" },
            { name: "짙은 갈색", hex: "#8D5B4C", border: "#633C30" }
        ];

        let gatherings = [];
        let memberExpandedState = {};
        let editingRecordTarget = null;

        window.onload = async function() {
            await loadFromGoogleSheet();
            renderTracker();
            renderGatherings();
            renderMemberSummaries();
            document.getElementById('g-date').value = new Date().toISOString().split('T')[0];
        };

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        function switchTab(tab) {
            const homeTab = document.getElementById('tab-home');
            const logTab = document.getElementById('tab-log');
            const btnHome = document.getElementById('nav-btn-home');
            const btnLog = document.getElementById('nav-btn-log');

            if (tab === 'home') {
                homeTab.classList.remove('hidden');
                logTab.classList.add('hidden');
                btnHome.classList.add('active');
                btnLog.classList.remove('active');
            } else {
                homeTab.classList.add('hidden');
                logTab.classList.remove('hidden');
                btnLog.classList.add('active');
                btnHome.classList.remove('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function loadFromGoogleSheet() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                gatherings = (data.gatherings && Array.isArray(data.gatherings)) ? data.gatherings : [];
            } catch(e) {
                gatherings = [];
                showToast("데이터 로드 실패");
            }
        }

        async function sendToSheet(type, payload) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ type: 'gathering', payload: payload })
                });
            } catch (e) {
                showToast("서버 전송 중 오류 발생");
            }
        }

        function renderTracker() {
            const grid = document.getElementById('teacups-grid');
            const countLabel = document.getElementById('tracker-count-label');
            grid.innerHTML = '';
            const totalCount = gatherings.length;
            countLabel.textContent = `${totalCount} / 12 달성`;

            for (let i = 0; i < 12; i++) {
                const isFilled = i < totalCount;
                const cupEl = document.createElement('div');
                cupEl.className = `teacup-box ${isFilled ? 'filled' : ''}`;
                cupEl.innerHTML = `
                    <span style="font-size: 16px;">${isFilled ? '🍵' : '🌱'}</span>
                    <span style="font-size: 9px; font-weight: 600; margin-top: 2px; color: ${isFilled ? '#79553D' : '#A89F91'};">#${i + 1}</span>
                `;
                grid.appendChild(cupEl);
            }
        }

        function openGatheringModal() {
            const password = prompt("멤버 전용 비밀번호를 입력해주세요:");
            if (password !== MEMBER_PASSWORD) {
                if (password !== null) showToast("비밀번호가 틀렸습니다.");
                return;
            }
            document.getElementById('gathering-form').reset();
            document.getElementById('g-id').value = '';
            document.getElementById('gathering-modal-title').textContent = "찻자리 카드 등록하기";
            document.getElementById('gathering-submit-btn').textContent = "찻자리 카드 생성하기";
            document.getElementById('g-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('gathering-modal').classList.remove('hidden');
        }

        function editGathering(id) {
            const password = prompt("멤버 전용 비밀번호를 입력해주세요:");
            if (password !== MEMBER_PASSWORD) {
                if (password !== null) showToast("비밀번호가 틀렸습니다.");
                return;
            }
            const g = gatherings.find(item => item.id === id);
            if (!g) return;

            document.getElementById('gathering-form').reset();
            document.getElementById('g-id').value = g.id;
            document.getElementById('g-date').value = g.date;
            document.getElementById('g-weather').value = g.weather || "☀️ 맑음";
            document.getElementById('g-teahouse').value = g.teahouse;
            document.getElementById('g-region').value = g.region;
            document.getElementById('g-theme').value = g.theme || "";
            document.getElementById('g-manager').value = g.manager || "경민";
            document.getElementById('g-description').value = g.description || "";

            document.getElementById('gathering-modal-title').textContent = "찻자리 카드 수정하기";
            document.getElementById('gathering-submit-btn').textContent = "찻자리 카드 수정 완료";
            document.getElementById('gathering-modal').classList.remove('hidden');
        }

        function closeGatheringModal() { document.getElementById('gathering-modal').classList.add('hidden'); }

        async function saveGatheringCard(e) {
            e.preventDefault();
            const id = document.getElementById('g-id').value;
            const date = document.getElementById('g-date').value;
            const weather = document.getElementById('g-weather').value;
            const teahouse = document.getElementById('g-teahouse').value;
            const region = document.getElementById('g-region').value;
            const theme = document.getElementById('g-theme').value;
            const manager = document.getElementById('g-manager').value;
            const description = document.getElementById('g-description').value;

            if (id) {
                const idx = gatherings.findIndex(item => item.id === id);
                if (idx !== -1) {
                    gatherings[idx] = {
                        ...gatherings[idx],
                        date, weather, teahouse, region, theme, manager, description
                    };
                }
            } else {
                const newGathering = {
                    id: 'g_' + Date.now(),
                    date, weather, teahouse, region, theme, manager, description,
                    memberRecords: {}
                };
                gatherings.unshift(newGathering);
            }

            await sendToSheet('gathering_update', gatherings);
            renderTracker(); renderGatherings(); renderMemberSummaries();
            closeGatheringModal();
            showToast(id ? "찻자리 카드 수정 완료 🍵" : "찻자리 카드 생성 완료 🍵");
        }

        function openRecordModal(targetGatheringId = null, targetMember = null) {
            if (gatherings.length === 0) {
                showToast("등록된 찻자리가 없습니다!");
                return;
            }
            const password = prompt("멤버 전용 비밀번호를 입력해주세요:");
            if (password !== MEMBER_PASSWORD) {
                if (password !== null) showToast("비밀번호가 틀렸습니다.");
                return;
            }

            editingRecordTarget = (targetGatheringId && targetMember) ? { gatheringId: targetGatheringId, member: targetMember } : null;

            const selectEl = document.getElementById('rec-gathering-id');
            const memberSelect = document.getElementById('rec-member');
            selectEl.innerHTML = '';
            gatherings.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = `[${g.date}] ${g.teahouse} (${g.region})`;
                selectEl.appendChild(opt);
            });

            if (targetGatheringId) selectEl.value = targetGatheringId;
            if (targetMember) memberSelect.value = targetMember;

            if (editingRecordTarget) {
                selectEl.disabled = true;
                memberSelect.disabled = true;
                document.getElementById('record-modal-title').textContent = `${targetMember}님의 기록 수정하기`;
                document.getElementById('record-submit-btn').textContent = "기록 수정 완료";
            } else {
                selectEl.disabled = false;
                memberSelect.disabled = false;
                document.getElementById('record-modal-title').textContent = "찻자리 기록 남기기";
                document.getElementById('record-submit-btn').textContent = "내 기록 저장하기";
            }

            document.getElementById('modal-tea-items-container').innerHTML = '';

            if (editingRecordTarget) {
                const g = gatherings.find(item => item.id === targetGatheringId);
                if (g && g.memberRecords && g.memberRecords[targetMember]) {
                    const existingTeas = Array.isArray(g.memberRecords[targetMember]) ? g.memberRecords[targetMember] : [g.memberRecords[targetMember]];
                    if (existingTeas.length > 0) {
                        existingTeas.forEach(t => addModalTeaItem(t));
                    } else {
                        addModalTeaItem();
                    }
                } else {
                    addModalTeaItem();
                }
            } else {
                addModalTeaItem();
            }

            document.getElementById('record-modal').classList.remove('hidden');
        }

        function closeRecordModal() { document.getElementById('record-modal').classList.add('hidden'); }

        function addModalTeaItem(data = {}) {
            const container = document.getElementById('modal-tea-items-container');
            const idx = container.children.length;
            const itemDiv = document.createElement('div');
            itemDiv.style.cssText = "background: #FBF9F5; padding: 12px; border-radius: 10px; border: 1px solid #E3DFD5; display: flex; flex-direction: column; gap: 8px;";
            
            let typeOptions = TEA_TYPES.map(t => `<option value="${t}" ${data.type === t ? 'selected' : ''}>${t}</option>`).join('');
            let colorButtonsHTML = '';
            LIQUOR_COLORS.forEach(c => {
                const isSelected = (data.colorHex === c.hex) || (!data.colorHex && c.hex === "#F3C68F");
                colorButtonsHTML += `
                    <button type="button" 
                        class="color-btn" 
                        style="width: 22px; height: 22px; border-radius: 50%; background-color: ${c.hex}; border: 2px solid ${c.border}; cursor: pointer; ${isSelected ? 'outline: 2px solid #79553D; transform: scale(1.1);' : ''}" 
                        onclick="selectColor(this, '${c.hex}', '${c.name}')">
                    </button>`;
            });

            itemDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 10px; font-weight: bold; color: #8C8279;">차 항목 #${idx + 1}</span>
                    ${idx > 0 ? `<button type="button" onclick="this.closest('div').parentElement.remove()" style="background:none; border:none; color:#D97757; font-size:11px; cursor:pointer;"><i class="fa-solid fa-trash-can"></i> 삭제</button>` : ''}
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label class="form-label" style="font-size:10px;">차 이름 *</label>
                        <input type="text" name="tea-name" value="${data.name || ''}" placeholder="예: 동정우롱" required class="form-input" style="margin-top:2px;">
                    </div>
                    <div>
                        <label class="form-label" style="font-size:10px;">차 종류</label>
                        <select name="tea-type" class="form-select" style="margin-top:2px;">${typeOptions}</select>
                    </div>
                </div>
                <div>
                    <label class="form-label" style="font-size:10px; margin-bottom:4px;">수색 선택</label>
                    <div style="display: flex; align-items: center; gap: 8px; background: white; padding: 6px 10px; border-radius: 8px; border: 1px solid #E3DFD5;">
                        <div style="display: flex; gap: 6px;">${colorButtonsHTML}</div>
                        <input type="hidden" name="tea-color-hex" value="${data.colorHex || '#F3C68F'}">
                        <input type="hidden" name="tea-color-name" value="${data.colorName || '따뜻한 호박색'}">
                        <span class="selected-color-label" style="font-size: 10px; color: #736A61; font-weight: 500;">${data.colorName || '따뜻한 호박색'}</span>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label class="form-label" style="font-size:10px;">향과 맛 *</label>
                        <input type="text" name="tea-flavor" value="${data.flavor || ''}" placeholder="예: 꽃향" required class="form-input" style="margin-top:2px;">
                    </div>
                    <div>
                        <label class="form-label" style="font-size:10px;">함께 먹은 다과</label>
                        <input type="text" name="tea-snack" value="${data.snack || ''}" placeholder="예: 화과자" class="form-input" style="margin-top:2px;">
                    </div>
                </div>
                <div>
                    <label class="form-label" style="font-size:10px;">메모</label>
                    <input type="text" name="tea-memo" value="${data.memo || ''}" placeholder="간단 소감" class="form-input" style="margin-top:2px;">
                </div>
            `;
            container.appendChild(itemDiv);
        }

        function selectColor(btn, hex, name) {
            const container = btn.closest('div').parentElement;
            const parentPalette = btn.parentElement;
            parentPalette.querySelectorAll('.color-btn').forEach(b => {
                b.style.outline = 'none';
                b.style.transform = 'scale(1)';
            });
            btn.style.outline = '2px solid #79553D';
            btn.style.transform = 'scale(1.1)';
            
            container.querySelector('[name="tea-color-hex"]').value = hex;
            container.querySelector('[name="tea-color-name"]').value = name;
            container.querySelector('.selected-color-label').textContent = name;
        }

        async function saveMemberRecords(e) {
            e.preventDefault();
            const gatheringId = editingRecordTarget ? editingRecordTarget.gatheringId : document.getElementById('rec-gathering-id').value;
            const member = editingRecordTarget ? editingRecordTarget.member : document.getElementById('rec-member').value;

            const teaItems = document.querySelectorAll('#modal-tea-items-container > div');
            const newTeas = [];
            teaItems.forEach(item => {
                newTeas.push({
                    name: item.querySelector('[name="tea-name"]').value,
                    type: item.querySelector('[name="tea-type"]').value,
                    colorHex: item.querySelector('[name="tea-color-hex"]').value,
                    colorName: item.querySelector('[name="tea-color-name"]').value,
                    flavor: item.querySelector('[name="tea-flavor"]').value,
                    snack: item.querySelector('[name="tea-snack"]').value,
                    memo: item.querySelector('[name="tea-memo"]').value
                });
            });

            try {
                const res = await fetch(API_URL);
                const serverData = await res.json();
                let currentGatherings = serverData.gatherings || gatherings;

                const gathering = currentGatherings.find(g => g.id === gatheringId);
                if (gathering) {
                    if (!gathering.memberRecords) gathering.memberRecords = {};
                    
                    if (editingRecordTarget) {
                        gathering.memberRecords[member] = newTeas;
                    } else {
                        if (!Array.isArray(gathering.memberRecords[member])) {
                            gathering.memberRecords[member] = [];
                        }
                        gathering.memberRecords[member].push(...newTeas);
                    }

                    gatherings = currentGatherings;
                    await sendToSheet('gathering_update', gatherings);
                    
                    renderTracker(); renderGatherings(); renderMemberSummaries();
                    closeRecordModal();
                    showToast(`${member}님 기록 ${editingRecordTarget ? '수정' : '추가'} 완료 🍵`);
                }
            } catch (err) {
                showToast("저장 중 오류 발생");
            }
        }

        async function deleteGathering(id) {
            if (confirm("이 찻자리 카드와 모든 기록을 삭제하시겠습니까?")) {
                gatherings = gatherings.filter(g => g.id !== id);
                await sendToSheet('gathering_update', gatherings);
                renderTracker(); renderGatherings(); renderMemberSummaries();
                showToast("삭제되었습니다.");
            }
        }

        function toggleMemberExpand(member) {
            memberExpandedState[member] = !memberExpandedState[member];
            renderMemberSummaries();
        }

        function renderMemberSummaries() {
            const container = document.getElementById('member-summary-cards');
            container.innerHTML = '';

            MEMBERS.forEach(member => {
                let allTeas = [];
                gatherings.forEach(g => {
                    if (g.memberRecords && g.memberRecords[member]) {
                        const records = Array.isArray(g.memberRecords[member]) ? g.memberRecords[member] : [g.memberRecords[member]];
                        records.forEach(t => allTeas.push({ ...t, teahouse: g.teahouse, gatheringId: g.id }));
                    }
                });

                const isExpanded = !!memberExpandedState[member];
                const displayTeas = isExpanded ? allTeas : allTeas.slice(0, 3);
                let teaHTML = allTeas.length === 0 ? `<p style="font-size:11px; color:#A89F91;">아직 기록된 차가 없습니다.</p>` : '';

                displayTeas.forEach(t => {
                    teaHTML += `
                        <div style="background: #FBF9F5; padding: 10px; border-radius: 10px; border: 1px solid #E3DFD5; font-size: 11px; margin-bottom: 6px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                                <div style="display:flex; align-items:center; gap:6px;">
                                    <span style="width:10px; height:10px; border-radius:50%; background:${t.colorHex || '#F3C68F'}; display:inline-block;"></span>
                                    <span style="font-weight:bold; color:#3C3633;">${t.name}</span>
                                    <span style="font-size:10px; color:#8C8279; background:white; padding:1px 4px; border-radius:4px; border:1px solid #EFECE6;">${t.type}</span>
                                </div>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span style="font-size:10px; color:#8C8279;">${t.teahouse}</span>
                                    <button onclick="openRecordModal('${t.gatheringId}', '${member}')" style="background:none; border:none; color:#79553D; font-size:10px; font-weight:600; cursor:pointer;"><i class="fa-solid fa-pen"></i> 수정</button>
                                </div>
                            </div>
                            <div style="font-size:11px; color:#79553D; font-weight:500; background:rgba(255,255,255,0.7); padding:4px 6px; border-radius:6px; margin-bottom:4px;">
                                🌿 향과 맛: ${t.flavor}
                            </div>
                            ${t.snack ? `<div style="font-size:10px; color:#736A61;">🍡 다과: ${t.snack}</div>` : ''}
                            ${t.memo ? `<div style="font-size:10px; color:#685D54; margin-top:2px;">💭 메모: ${t.memo}</div>` : ''}
                        </div>`;
                });

                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #E8E2D5; padding-bottom:8px; margin-bottom:10px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="width:24px; height:24px; border-radius:50%; background:#79553D; color:white; font-size:10px; font-weight:bold; display:flex; align-items:center; justify-content:center;">${member.slice(0, 1)}</span>
                            <h4 style="font-size:12px; font-weight:bold; color:#3C3633;">${member} 차 노트</h4>
                        </div>
                        <span style="font-size:10px; background:#F5F2EC; color:#79553D; padding:2px 8px; border-radius:99px; font-weight:600;">총 ${allTeas.length}잔</span>
                    </div>
                    <div>${teaHTML}</div>
                    ${allTeas.length > 3 ? `<button onclick="toggleMemberExpand('${member}')" style="width:100\%; font-size:11px; color:#79553D; font-weight:500; padding:8px; background:#F5F2EC; border:none; border-radius:8px; cursor:pointer; margin-top:4px;">${isExpanded ? '접기 ∧' : `+ 더보기 (전체 ${allTeas.length}개 보기) ∨`}</button>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function renderGatherings() {
            const container = document.getElementById('gatherings-container');
            const emptyState = document.getElementById('empty-state');
            const countLabel = document.getElementById('gathering-count');
            countLabel.textContent = `총 ${gatherings.length}개`;

            if (gatherings.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');
            container.innerHTML = '';

            gatherings.forEach(g => {
                const card = document.createElement('div');
                card.className = "card";
                card.style.padding = "0";
                card.style.overflow = "hidden";

                const formattedDate = g.date.replace(/-/g, '. ');
                let teaMap = {};
                if (g.memberRecords) {
                    Object.keys(g.memberRecords).forEach(member => {
                        if (g.memberRecords[member]) {
                            const records = Array.isArray(g.memberRecords[member]) ? g.memberRecords[member] : [g.memberRecords[member]];
                            records.forEach(t => {
                                if (!teaMap[t.name]) teaMap[t.name] = { type: t.type, entries: [], colors: new Set() };
                                teaMap[t.name].entries.push({ member, flavor: t.flavor });
                                if (t.colorHex) teaMap[t.name].colors.add(t.colorHex);
                            });
                        }
                    });
                }

                let teaGroupsHTML = '';
                const teaKeys = Object.keys(teaMap);
                if (teaKeys.length === 0) {
                    teaGroupsHTML = `<p style="font-size:11px; color:#A89F91; text-align:center; padding:4px;">등록된 개인 기록이 없어요.</p>`;
                } else {
                    teaKeys.forEach(teaName => {
                        const info = teaMap[teaName];
                        let colorCircles = '';
                        info.colors.forEach(hex => {
                            colorCircles += `<span style="width:10px; height:10px; border-radius:50%; background:${hex}; border:1px solid rgba(0,0,0,0.1); display:inline-block;"></span>`;
                        });
                        let entriesHTML = '';
                        info.entries.forEach(e => {
                            entriesHTML += `<div style="font-size:11px; color:#5C524B; padding:2px 0;"><span style="font-weight:bold; color:#79553D;">[${e.member}]</span> 향과 맛: ${e.flavor}</div>`;
                        });
                        teaGroupsHTML += `
                            <div style="background:#FBF9F5; padding:10px; border-radius:10px; border:1px solid #E3DFD5; margin-bottom:8px;">
                                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #E8E2D5; padding-bottom:4px; margin-bottom:4px;">
                                    <div style="display:flex; align-items:center; gap:6px;">
                                        <div style="display:flex; gap:2px;">${colorCircles}</div>
                                        <span style="font-weight:bold; font-size:12px; color:#3C3633;">${teaName}</span>
                                        <span style="font-size:10px; color:#8C8279; background:white; padding:1px 4px; border-radius:4px; border:1px solid #E3DFD5;">${info.type}</span>
                                    </div>
                                </div>
                                <div>${entriesHTML}</div>
                            </div>`;
                    });
                }

                card.innerHTML = `
                    <div style="background:#F5F2EC; padding:12px 16px; border-bottom:1px solid #E8E2D5;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <div style="display:flex; align-items:center; gap:6px;">
                                <span style="font-size:10px; font-weight:600; color:#79553D; background:white; padding:2px 6px; border-radius:6px; border:1px solid #E3DFD5;">${formattedDate}</span>
                                <span style="font-size:10px; color:#736A61;">${g.weather || ''}</span>
                                <span style="font-size:10px; color:#736A61; background:rgba(255,255,255,0.6); padding:2px 6px; border-radius:6px;">📍 ${g.region}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <button onclick="editGathering('${g.id}')" style="background:none; border:none; color:#736A61; cursor:pointer; padding: 2px 4px;"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteGathering('${g.id}')" style="background:none; border:none; color:#A89F91; cursor:pointer; padding: 2px 4px;"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="font-size:13px; font-weight:bold; color:#3C3633; display:flex; align-items:center; gap:6px;">
                                <i class="fa-solid fa-mug-hot" style="color:#79553D; font-size:12px;"></i>
                                <span>${g.teahouse}</span>
                            </h3>
                            ${g.theme ? `<span style="font-size:10px; font-weight:500; color:#5C524B; background:#EFECE6; padding:2px 8px; border-radius:99px;"># ${g.theme}</span>` : ''}
                        </div>
                        ${g.description ? `<p style="font-size:11px; color:#685D54; margin-top:6px; background:white; padding:6px 8px; border-radius:8px; border:1px solid #E8E2D5;">💡 ${g.description}</p>` : ''}
                        <div style="font-size:10px; color:#8C8279; margin-top:6px;">담당자: ${g.manager || '경민'}</div>
                    </div>
                    <div style="padding: 12px 16px;">${teaGroupsHTML}</div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
